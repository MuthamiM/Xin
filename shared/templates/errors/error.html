<!DOCTYPE html>
<html lang="en" data-theme="electric-blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xin - {{ title }}</title>
  <link rel="stylesheet" href="/static/css/themes.css">
  <style>
    body {
      background: var(--bg, #090b10);
      color: var(--text, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .error-card {
      max-width: 460px;
      width: 100%;
      background: var(--panel, #111520);
      border: 1px solid var(--border-blue, #2563eb);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
    }
    .error-code {
      display: inline-block;
      background: var(--blue-subtle, rgba(37, 99, 235, 0.15));
      color: var(--blue-light, #3b82f6);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p {
      font-size: 13px;
      color: var(--text-muted, #8490a5);
      line-height: 1.6;
      margin: 0 0 20px;
    }
    .btn-home {
      display: inline-block;
      background: var(--blue, #2563eb);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 24px;
      box-shadow: 0 0 14px var(--blue-glow, rgba(37, 99, 235, 0.45));
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">HTTP {{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn-home" href="/">Return to Xin</a>
  </div>
  <script src="/static/js/xin_shared.js"></script>
</body>
</html>
