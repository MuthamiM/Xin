<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Xin - 1-on-1 Live Video Call</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0c13;
      --panel: #131520;
      --card: #1a1d2e;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --accent-glow: rgba(255, 71, 87, 0.3);
      --green: #2ed573;
      --text: #ffffff;
      --text-muted: #8b90a6;
      --border: #25283b;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Outer Wrapper */
    .app-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* TOP MINIMAL BAR */
    .top-bar {
      height: 48px;
      background: rgba(19, 21, 32, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 20;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-tag {
      background: var(--accent);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .brand-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* ==========================================================================
       MAIN VIDEO STAGE & LAYOUT SYSTEM
       Three Clean Layout Modes:
       1. layout-split: 50/50 Dual Video (Side-by-side desktop, stacked mobile)
       2. layout-pip: Fullscreen Primary + Floating Corner Secondary
       3. layout-focus: 100% Primary Video Only
       ========================================================================== */
    .stage {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      min-height: 0;
    }

    /* Video Containers */
    .video-box {
      position: relative;
      background: #06070a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      transform: scaleX(-1);
    }

    /* Video Badges */
    .v-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(11, 12, 19, 0.75);
      border-left: 3px solid var(--accent);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 0 4px 4px 0;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      z-index: 5;
    }
    .v-badge.local-badge {
      border-left-color: #3b82f6;
    }

    /* Waiting Screen for Remote Peer */
    .waiting-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #181a28 0%, #08090f 80%);
      padding: 24px;
      text-align: center;
      gap: 14px;
      z-index: 4;
    }
    .pulsing-ring {
      width: 56px;
      height: 56px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .wait-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }
    .wait-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 340px;
      line-height: 1.5;
    }

    /* -------------------------------------------------------------
       LAYOUT 1: SPLIT 50/50 (Default)
       Desktop: Side-by-Side (50% | 50%)
       Mobile: Stacked (Top 50% / Bottom 50%)
       ------------------------------------------------------------- */
    .stage.layout-split {
      flex-direction: row;
    }
    .stage.layout-split #remoteContainer {
      flex: 1;
      height: 100%;
      border-right: 2px solid var(--border);
    }
    .stage.layout-split #localContainer {
      flex: 1;
      height: 100%;
    }

    @media (max-width: 860px) {
      .stage.layout-split {
        flex-direction: column;
      }
      .stage.layout-split #remoteContainer {
        flex: 1;
        width: 100%;
        border-right: none;
        border-bottom: 2px solid var(--border);
      }
      .stage.layout-split #localContainer {
        flex: 1;
        width: 100%;
      }
    }

    /* -------------------------------------------------------------
       LAYOUT 2: PICTURE-IN-PICTURE (PiP)
       Stranger is Fullscreen, Your camera is floating in corner.
       Clicking corner swaps the views!
       ------------------------------------------------------------- */
    .stage.layout-pip #remoteContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .stage.layout-pip #localContainer {
      position: absolute;
      bottom: 84px;
      right: 16px;
      width: 220px;
      height: 130px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      z-index: 10;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .stage.layout-pip #localContainer {
        bottom: 80px;
        right: 12px;
        width: 130px;
        height: 180px;
        border-radius: 8px;
      }
    }

    /* -------------------------------------------------------------
       LAYOUT 3: INVERTED PiP (You are full screen, Stranger in corner)
       ------------------------------------------------------------- */
    .stage.layout-swap #localContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .stage.layout-swap #remoteContainer {
      position: absolute;
      bottom: 84px;
      right: 16px;
      width: 220px;
      height: 130px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      z-index: 10;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .stage.layout-swap #remoteContainer {
        bottom: 80px;
        right: 12px;
        width: 130px;
        height: 180px;
        border-radius: 8px;
      }
    }

    /* ==========================================================================
       BOTTOM FLOATING ACTION CONTROLS BAR (Ultra-Clean, High-Contrast)
       ========================================================================== */
    .controls-dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(19, 21, 32, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 50px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      z-index: 30;
    }
    @media (max-width: 860px) {
      .controls-dock {
        width: calc(100% - 20px);
        bottom: 10px;
        gap: 6px;
        padding: 8px 10px;
        justify-content: space-between;
      }
    }

    /* Action Buttons */
    .c-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 16px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .c-btn:hover {
      background: #252a42;
      border-color: var(--accent);
    }
    .c-btn:active {
      transform: scale(0.96);
    }
    .c-btn-next {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      padding: 0 22px;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .c-btn-next:hover {
      background: var(--accent-hover);
    }
    .c-btn.active-green {
      border-color: var(--green);
      color: var(--green);
    }
    .c-btn.muted-red {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255, 71, 87, 0.15);
    }
    .c-btn-stop {
      background: #231215;
      border-color: #5e1c24;
      color: #ef4444;
    }

    @media (max-width: 860px) {
      .c-btn {
        height: 40px;
        padding: 0 10px;
        font-size: 11px;
        border-radius: 20px;
      }
      .c-btn-next {
        padding: 0 14px;
      }
    }

    /* Slide-Up Chat Drawer */
    .chat-drawer {
      position: absolute;
      bottom: 74px;
      left: 16px;
      width: 360px;
      height: 380px;
      background: rgba(19, 21, 32, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      z-index: 40;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      display: none;
    }
    .chat-drawer.open {
      display: flex;
    }
    .chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header span {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .chat-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }
    .chat-logs {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-line {
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg-sys {
      background: rgba(255, 71, 87, 0.12);
      border-left: 2px solid var(--accent);
      padding: 4px 8px;
      color: var(--accent);
      font-size: 11px;
      border-radius: 0 4px 4px 0;
    }
    .msg-you span { color: #3b82f6; font-weight: 700; }
    .msg-peer span { color: var(--accent); font-weight: 700; }
    .chat-input-bar {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }
    .chat-input-bar input {
      flex: 1;
      background: #0b0c13;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 12px;
    }
    .chat-input-bar button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      .chat-drawer {
        left: 10px;
        right: 10px;
        width: auto;
        bottom: 64px;
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-tag">XIN</div>
        <div class="brand-title">1-on-1 Stream</div>
      </div>
      <div class="header-status">
        <div class="status-dot"></div>
        <span id="callStatusText">READY // STANDBY</span>
      </div>
    </header>

    <!-- MAIN VIDEO STAGE (Default layout: layout-split) -->
    <main class="stage layout-split" id="videoStage">

      <!-- REMOTE STRANGER VIDEO BOX -->
      <div class="video-box" id="remoteContainer" onclick="handleVideoBoxClick('remote')">
        <div class="v-badge" id="remoteBadge">STRANGER // REMOTE</div>
        <video id="remoteVideo" autoplay playsinline></video>

        <!-- Waiting Layer -->
        <div class="waiting-layer" id="waitingLayer">
          <div class="pulsing-ring"></div>
          <div class="wait-title" id="waitTitleText">Searching For Stranger</div>
          <div class="wait-desc" id="waitDescText">Connect from phone and laptop to begin instant 1-on-1 call.</div>
        </div>
      </div>

      <!-- LOCAL USER VIDEO BOX -->
      <div class="video-box" id="localContainer" onclick="handleVideoBoxClick('local')">
        <div class="v-badge local-badge">YOU // LOCAL</div>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>

    </main>

    <!-- FLOATING CHAT DRAWER -->
    <div class="chat-drawer" id="chatDrawer">
      <div class="chat-header">
        <span>Live Peer Chat</span>
        <button class="chat-close" onclick="toggleChat()">X</button>
      </div>
      <div class="chat-logs" id="chatLogs">
        <div class="msg-line msg-sys">Xin session active. Real camera & microphone enabled.</div>
      </div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">SEND</button>
      </div>
    </div>

    <!-- CLEAN FLOATING ACTION CONTROLS -->
    <nav class="controls-dock">
      <!-- 1. Next Stranger -->
      <button class="c-btn c-btn-next" onclick="nextPeer()">NEXT</button>

      <!-- 2. Switch View (Split / PiP / Swap) -->
      <button class="c-btn" id="btnView" onclick="cycleViewMode()">VIEW: SPLIT</button>

      <!-- 3. Toggle Microphone -->
      <button class="c-btn active-green" id="btnMic" onclick="toggleMic()">MIC ON</button>

      <!-- 4. Toggle Camera -->
      <button class="c-btn active-green" id="btnCam" onclick="toggleCam()">CAM ON</button>

      <!-- 5. Flip Camera (Mobile) -->
      <button class="c-btn" id="btnFlip" onclick="flipCam()">FLIP</button>

      <!-- 6. Chat Drawer Toggle -->
      <button class="c-btn" id="btnChat" onclick="toggleChat()">CHAT</button>

      <!-- 7. Disconnect -->
      <button class="c-btn c-btn-stop" onclick="disconnect()">STOP</button>
    </nav>

  </div>

  <script>
    // State
    const userId = 'usr_' + Math.random().toString(36).substring(2, 10);
    let partnerId = null;
    let isInitiator = false;
    let localStream = null;
    let peerConnection = null;
    let ws = null;
    let pollTimer = null;
    let facingMode = 'user';
    let isMicMuted = false;
    let isCamOff = false;

    // View Modes: 'split' -> 'pip' -> 'swap'
    const viewModes = ['split', 'pip', 'swap'];
    let currentViewIndex = 0;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    };

    // 1. Media Acquisition
    async function initMedia() {
      try {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
        }
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        const localVid = document.getElementById('localVideo');
        localVid.srcObject = localStream;
        localVid.play().catch(() => {});

        // Re-inject tracks into peer connection if open
        if (peerConnection) {
          localStream.getTracks().forEach(track => {
            const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === track.kind);
            if (sender) sender.replaceTrack(track);
            else peerConnection.addTrack(track, localStream);
          });
        }

        connectSignaling();
      } catch (err) {
        console.warn('getUserMedia error:', err);
        addSysLog('Allow camera and microphone access to connect with peer.');
      }
    }

    // 2. View Mode Switcher (Split -> PiP -> Swap)
    function cycleViewMode() {
      currentViewIndex = (currentViewIndex + 1) % viewModes.length;
      applyViewMode(viewModes[currentViewIndex]);
    }

    function applyViewMode(mode) {
      const stage = document.getElementById('videoStage');
      const btn = document.getElementById('btnView');
      stage.classList.remove('layout-split', 'layout-pip', 'layout-swap');

      if (mode === 'split') {
        stage.classList.add('layout-split');
        btn.textContent = 'VIEW: SPLIT';
      } else if (mode === 'pip') {
        stage.classList.add('layout-pip');
        btn.textContent = 'VIEW: PiP';
      } else if (mode === 'swap') {
        stage.classList.add('layout-swap');
        btn.textContent = 'VIEW: YOU';
      }
    }

    function handleVideoBoxClick(which) {
      const stage = document.getElementById('videoStage');
      if (stage.classList.contains('layout-pip')) {
        applyViewMode('swap');
      } else if (stage.classList.contains('layout-swap')) {
        applyViewMode('pip');
      }
    }

    // 3. WebRTC Peer Connection
    function setupPeerConnection() {
      if (peerConnection) {
        try { peerConnection.close(); } catch (e) {}
      }
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      }

      peerConnection.ontrack = (event) => {
        const remoteVid = document.getElementById('remoteVideo');
        const waitLayer = document.getElementById('waitingLayer');
        const statusText = document.getElementById('callStatusText');

        if (event.streams && event.streams[0]) {
          remoteVid.srcObject = event.streams[0];
          waitLayer.style.display = 'none';
          statusText.textContent = 'LIVE // CONNECTED';
          statusText.style.color = '#2ed573';
          addSysLog('Stranger connected with audio and video.');
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && partnerId) {
          sendSignal({ type: 'candidate', candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          onPeerDisconnected();
        }
      };

      return peerConnection;
    }

    // 4. Signaling (WebSocket + HTTP Fallback)
    function connectSignaling() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${window.location.host}/ws/signal`;

      try {
        ws = new WebSocket(url);
        ws.onopen = () => {
          ws.send(JSON.stringify({ action: 'join', user_id: userId }));
        };
        ws.onmessage = (e) => {
          try { handleSignal(JSON.parse(e.data)); } catch (err) {}
        };
        ws.onerror = () => startHttpPolling();
        ws.onclose = () => startHttpPolling();
      } catch (e) {
        startHttpPolling();
      }
    }

    function startHttpPolling() {
      if (pollTimer) return;
      fetch('/api/signaling/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
      }).catch(() => {});
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`/api/signaling/poll?user_id=${userId}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.messages) data.messages.forEach(handleSignal);
        } catch (err) {}
      }, 1000);
    }

    function sendSignal(payload) {
      if (!partnerId) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'signal', target_id: partnerId, data: payload }));
      } else {
        fetch('/api/signaling/signal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender_id: userId, target_id: partnerId, data: payload })
        }).catch(() => {});
      }
    }

    async function handleSignal(msg) {
      if (msg.type === 'waiting') {
        document.getElementById('waitTitleText').textContent = 'Searching For Stranger';
        document.getElementById('waitDescText').textContent = 'Waiting for phone or laptop peer to enter call.';
        document.getElementById('callStatusText').textContent = 'WAITING IN QUEUE';
      } else if (msg.type === 'matched') {
        partnerId = msg.peer_id;
        isInitiator = msg.is_initiator;
        document.getElementById('waitTitleText').textContent = 'Stranger Found';
        document.getElementById('waitDescText').textContent = 'Establishing secure WebRTC stream...';
        setupPeerConnection();

        if (isInitiator) {
          const offer = await peerConnection.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
          await peerConnection.setLocalDescription(offer);
          sendSignal({ type: 'offer', sdp: offer.sdp });
        }
      } else if (msg.type === 'signal') {
        const sig = msg.data;
        if (!peerConnection) setupPeerConnection();

        if (sig.type === 'offer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: sig.sdp }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          sendSignal({ type: 'answer', sdp: answer.sdp });
        } else if (sig.type === 'answer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: sig.sdp }));
        } else if (sig.type === 'candidate') {
          await peerConnection.addIceCandidate(new RTCIceCandidate(sig.candidate));
        }
      } else if (msg.type === 'chat') {
        addPeerLog(msg.user || 'Stranger', msg.text);
      } else if (msg.type === 'peer_disconnected') {
        onPeerDisconnected();
      }
    }

    function onPeerDisconnected() {
      const waitLayer = document.getElementById('waitingLayer');
      const remoteVid = document.getElementById('remoteVideo');
      const statusText = document.getElementById('callStatusText');
      waitLayer.style.display = 'flex';
      document.getElementById('waitTitleText').textContent = 'Call Disconnected';
      document.getElementById('waitDescText').textContent = 'Click NEXT to match with another stranger.';
      remoteVid.srcObject = null;
      statusText.textContent = 'STANDBY';
      statusText.style.color = 'var(--text-muted)';
      addSysLog('Stranger disconnected.');

      if (peerConnection) {
        try { peerConnection.close(); } catch (e) {}
        peerConnection = null;
      }
      partnerId = null;
    }

    // 5. Controls Actions
    function nextPeer() {
      onPeerDisconnected();
      document.getElementById('waitTitleText').textContent = 'Searching For Stranger';
      addSysLog('Searching for next stranger...');

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'next', user_id: userId }));
      } else {
        fetch('/api/signaling/next', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        }).catch(() => {});
      }
    }

    function disconnect() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'leave', user_id: userId }));
      } else {
        fetch('/api/signaling/leave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        }).catch(() => {});
      }
      onPeerDisconnected();
      addSysLog('Call ended.');
    }

    function toggleMic() {
      if (!localStream) return;
      const audioTracks = localStream.getAudioTracks();
      if (!audioTracks.length) return;
      isMicMuted = !isMicMuted;
      audioTracks.forEach(t => t.enabled = !isMicMuted);

      const btn = document.getElementById('btnMic');
      if (isMicMuted) {
        btn.classList.remove('active-green');
        btn.classList.add('muted-red');
        btn.textContent = 'MIC OFF';
      } else {
        btn.classList.add('active-green');
        btn.classList.remove('muted-red');
        btn.textContent = 'MIC ON';
      }
    }

    function toggleCam() {
      if (!localStream) return;
      const videoTracks = localStream.getVideoTracks();
      if (!videoTracks.length) return;
      isCamOff = !isCamOff;
      videoTracks.forEach(t => t.enabled = !isCamOff);

      const btn = document.getElementById('btnCam');
      const localVid = document.getElementById('localVideo');
      if (isCamOff) {
        btn.classList.remove('active-green');
        btn.classList.add('muted-red');
        btn.textContent = 'CAM OFF';
        localVid.style.opacity = '0.2';
      } else {
        btn.classList.add('active-green');
        btn.classList.remove('muted-red');
        btn.textContent = 'CAM ON';
        localVid.style.opacity = '1.0';
      }
    }

    async function flipCam() {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      addSysLog('Switching camera lens...');
      await initMedia();
    }

    function toggleChat() {
      const drawer = document.getElementById('chatDrawer');
      drawer.classList.toggle('open');
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      addYourLog(text);

      if (partnerId) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'chat', target_id: partnerId, user: 'Stranger', text: text }));
        } else {
          fetch('/api/signaling/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender_id: userId, target_id: partnerId, user: 'Stranger', text: text })
          }).catch(() => {});
        }
      }
    }

    function addYourLog(text) {
      const box = document.getElementById('chatLogs');
      const row = document.createElement('div');
      row.className = 'msg-line msg-you';
      row.innerHTML = `<span>You: </span>${escapeHtml(text)}`;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function addPeerLog(author, text) {
      const box = document.getElementById('chatLogs');
      const row = document.createElement('div');
      row.className = 'msg-line msg-peer';
      row.innerHTML = `<span>${escapeHtml(author)}: </span>${escapeHtml(text)}`;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function addSysLog(text) {
      const box = document.getElementById('chatLogs');
      const row = document.createElement('div');
      row.className = 'msg-line msg-sys';
      row.textContent = text;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('DOMContentLoaded', initMedia);
  </script>
</body>
</html>
