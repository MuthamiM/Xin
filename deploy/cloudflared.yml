# Cloudflare Named Tunnel Configuration for Xin
# Domain: mftechnologies.org

tunnel: xin-mesh-tunnel
credentials-file: C:\Users\cantroll\.cloudflared\xin-mesh-tunnel.json
protocol: http2

ingress:
  # Main Xin 1-on-1 Video Stream and Real-time Chat
  - hostname: xin.mftechnologies.org
    service: http://127.0.0.1:5000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true

  # Root apex domain routing
  - hostname: mftechnologies.org
    service: http://127.0.0.1:5000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true

  # Catch-all
  - service: http_status:404
