user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 20480;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # 150 Gbps microcache for 1000 streams
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=stream_cache:200m max_size=20g inactive=2m use_temp_path=off;

    upstream xin_cluster {
        server xin_core:5000;
        keepalive 128;
    }

    upstream mediamtx_hls {
        server xin_mediamtx:8888;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        # Geofencing verification at edge
        # Allow East Africa, South Africa, Asia
        location / {
            proxy_pass http://xin_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MediaMTX Low-Latency HLS caching
        location /hls/ {
            proxy_pass http://mediamtx_hls/;
            proxy_cache stream_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_valid 404 1s;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
