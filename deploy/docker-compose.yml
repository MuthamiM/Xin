version: '3.8'

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: xin_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP ingest
      - "1935:1935"   # RTMP ingest
      - "8888:8888"   # HLS egress (1000 streams)
      - "8889:8889"   # WebRTC WHIP/WHEP egress
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  redis:
    image: redis:7-alpine
    container_name: xin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  xin_app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: xin_core
    restart: unless-stopped
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - PHONE_STREAM_URL=https://192.168.1.201:4444/video/mjpeg
      - REDIS_URL=redis://xin_redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mediamtx

  nginx_edge:
    image: nginx:alpine
    container_name: xin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_edge.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - xin_app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: xin_cloudflared
    restart: unless-stopped
    command: tunnel --protocol http2 --url http://nginx_edge:80
    depends_on:
      - nginx_edge
